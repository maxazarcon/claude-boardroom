<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Boardroom</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel2: #23272f; --line: #313742;
    --fg: #e6e8ec; --dim: #949cab; --accent: #c98a5a; --good: #6fbf8b;
    --warn: #d8a657; --bad: #d98a8a; --mod: #7aa6d8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 14px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  header .db { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 0; align-items: start; }
  .side { border-right: 1px solid var(--line); min-height: calc(100vh - 52px); }
  .pane { padding: 16px 18px; }
  section { border-bottom: 1px solid var(--line); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
       color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  h3 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; font-family: inherit; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #17191d; font-weight: 600; }
  button.ghost { background: transparent; color: var(--dim); }
  button.waiting { opacity: .5; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  input, textarea, select { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 8px; font: inherit; width: 100%; }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .muted { color: var(--dim); }
  .small { font-size: 12px; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  pre { background: #0f1114; border: 1px solid var(--line); border-radius: 6px;
        padding: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 6px 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  .item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
          margin-bottom: 6px; background: var(--panel); }
  .item.active { border-color: var(--accent); }
  .roomrow { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .tag.ok { color: var(--good); border-color: #2f4a3a; }
  .tag.no { color: var(--dim); }
  .feed { max-height: 46vh; overflow-y: auto; border: 1px solid var(--line);
          border-radius: 8px; padding: 10px; background: #101216; }
  .msg { padding: 6px 8px; border-left: 3px solid var(--line); margin-bottom: 6px; }
  .msg .who { font-weight: 600; font-size: 12px; }
  .msg .meta { color: var(--dim); font-size: 11px; }
  .msg .body { white-space: pre-wrap; }
  .msg.moderator { border-left-color: var(--mod); background: #161b22; }
  .msg.moderator .who { color: var(--mod); }
  .msg.system { border-left-color: var(--warn); background: #1a1710; }
  .msg.system .who { color: var(--warn); }
  .msg.participant { border-left-color: #3d4553; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chip { display: inline-block; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
          margin: 0 5px 5px 0; cursor: pointer; font-size: 12px; background: var(--panel); }
  .chip.sel { border-color: var(--accent); color: var(--accent); }
  .banner { padding: 8px 10px; border-radius: 6px; background: var(--panel2);
            border: 1px solid var(--line); margin-bottom: 10px; }
  .banner.err { border-color: #5a3232; color: var(--bad); }
  .banner.ok { border-color: #2f4a3a; color: var(--good); }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px;
                    text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
  .stack > * + * { margin-top: 10px; }
  .p-name { font-weight: 600; }
  .empty { color: var(--dim); font-style: italic; padding: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>Claude Boardroom</h1>
  <span class="db" id="dbpath"></span>
  <span style="margin-left:auto" id="appstatus"></span>
</header>

<main>
  <div class="side">
    <section class="pane">
      <h2>Rooms</h2>
      <ul id="rooms"></ul>
      <div class="row" style="margin-top:8px">
        <input id="newroom" placeholder="new room name">
        <button id="createroom">Create</button>
      </div>
    </section>

    <section class="pane">
      <h2>Waiting room</h2>
      <ul id="waiting"></ul>
    </section>
  </div>

  <div>
    <section class="pane" id="roompane">
      <div class="empty">Select a room on the left, or create one.</div>
    </section>

    <section class="pane">
      <details id="setup-details" open>
        <summary>Setup &amp; projects</summary>
        <div class="stack" style="margin-top:12px">
          <div id="wiring"></div>

          <div>
            <h3>Projects folder</h3>
            <div class="row">
              <input id="base" placeholder="C:\Users\you\Projects — your Claude projects folder">
              <button id="browse" style="display:none">Browse…</button>
              <button id="usefolder" class="primary">Use this folder</button>
            </div>
            <div class="small muted" style="margin-top:6px" id="autoreg"></div>
          </div>

          <div id="folderlist"></div>

          <details id="manual-details">
            <summary>Manual config, for another machine</summary>
            <div class="stack" style="margin-top:12px" id="setup"></div>
          </details>
        </div>
      </details>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let state = { rooms: [], participants: [], waiting_room: 0 };
let selectedRoom = null;
let roomData = null;
let order = [];
let setup = null;
let appInfo = null;
let wiring = null;
let wiringSig = null;
let folders = null;
let turnResult = null;
let busy = false;
let autorunPreference = localStorage.getItem('boardroom.autorun') !== '0';

async function api(path, opts) {
  const res = await fetch(path, opts);
  return res.json();
}
const post = (path, body) =>
  api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const time = (iso) => { try { return new Date(iso).toLocaleTimeString(); } catch { return iso; } };

/* ------------------------------------------- typing through a polling render */
// The panes are rebuilt wholesale on a timer. Left alone that wipes whatever
// you are typing and drops focus mid-word every couple of seconds, so:
//   1. a render that would change nothing is skipped entirely, and
//   2. a render that does happen carries field contents and the caret across.

const drafts = {};

function paint(el, html) {
  const active = document.activeElement;
  const focus =
    active && active.id && /^(INPUT|TEXTAREA)$/.test(active.tagName)
      ? { id: active.id, start: active.selectionStart, end: active.selectionEnd }
      : null;

  el.innerHTML = html;

  el.querySelectorAll('input, textarea').forEach((f) => {
    if (!f.id) return;
    if (drafts[f.id] !== undefined) f.value = drafts[f.id];
    f.addEventListener('input', () => { drafts[f.id] = f.value; });
  });

  if (focus) {
    const again = document.getElementById(focus.id);
    if (again) {
      again.focus();
      try { again.setSelectionRange(focus.start, focus.end); } catch { /* not a text field */ }
    }
  }
}

// Clearing a field after sending has to clear its draft too, or the next
// render helpfully puts the text back.
function clearField(id) {
  delete drafts[id];
  const el = $(id);
  if (el) el.value = '';
}

/* ------------------------------------------------------------------ rendering */

let sideSig = null;

function renderSide() {
  const sig = JSON.stringify([state.rooms, state.participants, selectedRoom]);
  if (sig === sideSig) return;
  sideSig = sig;

  paint($('rooms'), state.rooms.length
    ? state.rooms.map((r) => `
        <li class="item ${r.name === selectedRoom ? 'active' : ''}">
          <div class="roomrow" data-room="${esc(r.name)}">
            <span>${esc(r.name)}</span>
            <span class="tag">${r.participants} here</span>
          </div>
        </li>`).join('')
    : '<li class="empty">No rooms yet.</li>');

  document.querySelectorAll('.roomrow').forEach((el) =>
    el.onclick = () => { selectedRoom = el.dataset.room; order = []; turnResult = null; refreshRoom(); renderSide(); });

  const waiting = state.participants.filter((p) => !p.room);
  paint($('waiting'), waiting.length
    ? waiting.map((p) => `
        <li class="item">
          <div class="p-name">${esc(p.name)}</div>
          <div class="small muted">${p.folder_path ? esc(p.folder_path) : 'no folder — Desktop or registered without cwd'}</div>
          <div class="row small" style="margin-top:6px">
            <select data-assign="${esc(p.name)}">
              <option value="">assign to…</option>
              ${state.rooms.map((r) => `<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('')}
            </select>
            <button class="ghost" data-forget="${esc(p.name)}" title="Remove this participant record">✕</button>
          </div>
        </li>`).join('')
    : '<li class="empty">Nobody waiting.</li>');

  document.querySelectorAll('[data-assign]').forEach((el) =>
    el.onchange = async () => {
      if (!el.value) return;
      await post('/api/assign', { name: el.dataset.assign, room: el.value });
      refreshAll();
    });
  document.querySelectorAll('[data-forget]').forEach((el) =>
    el.onclick = async () => {
      if (!confirm(`Forget participant "${el.dataset.forget}"? Their messages stay in the room.`)) return;
      await post('/api/forget', { name: el.dataset.forget });
      refreshAll();
    });
}

function autorunPanel() {
  const a = roomData.autorun || {};
  const mine = a.active && a.room === selectedRoom;
  const last = (a.log || [])[a.log.length - 1];

  if (mine) {
    return `
      <div class="banner">
        <div class="row" style="justify-content:space-between">
          <div><b>Round-robin running</b> — ${esc(a.detail || a.step || '')}</div>
          <button id="stoprun">Stop</button>
        </div>
        <div class="small muted" style="margin-top:4px">
          Turn ${a.turns} of at most ${a.max_turns}. Each one is a real headless run.
        </div>
      </div>`;
  }

  const stoppedHere = last && !a.active && ['stalled','waiting','auth_required','stopped','error','finished'].includes(a.step);
  return `
    ${stoppedHere ? `<div class="banner ${a.step === 'finished' ? 'ok' : 'err'}">
        Round-robin ${esc(a.step)} — ${esc(a.detail || '')}
      </div>` : ''}
    <div class="row" style="margin-bottom:8px">
      <button class="primary" id="startrun">Run round-robin</button>
      <span class="small muted">Takes each turn in order, then collects votes, until it resolves.</span>
    </div>`;
}

function discussionPanel(d) {
  const assigned = roomData.participants.map((p) => p.name);

  if (d && d.active) {
    const phaseLine = d.phase === 'speaking'
      ? `Speaking — <b>${esc(d.current_speaker || '—')}</b> is up`
      : `Voting — <b>${d.votes_cast} of ${d.votes_total} voted</b> (direction hidden until all are in)`;
    return `
      <div class="banner">
        <div><b>Round ${d.round}</b> · ${phaseLine}</div>
        <div class="small muted" style="margin-top:4px">Order: ${d.order.map(esc).join(' → ')}</div>
        <div style="margin-top:6px">${esc(d.prompt)}</div>
        ${d.rounds.length ? `<div class="small muted" style="margin-top:6px">Completed: ${
          d.rounds.map((r) => `round ${r.round} — ${r.yes}/${r.total} agreed`).join(' · ')}</div>` : ''}
      </div>
      ${autorunPanel()}`;
  }

  const resolvedBanner = d && d.resolved ? `
    <div class="banner ok">
      Resolved after round ${d.round} — ${(() => { const l = d.rounds[d.rounds.length - 1];
        return l ? `${l.yes}/${l.total} agreed` : 'unanimous'; })()}.
      <div class="small" style="margin-top:4px">${esc(d.prompt)}</div>
    </div>` : '';

  return `
    ${resolvedBanner}
    <textarea id="dprompt" placeholder="The issue to resolve…"></textarea>
    <div class="small muted" style="margin:8px 0 4px">Speaking order — click names in the order they should speak:</div>
    <div>${assigned.map((n) => {
      const i = order.indexOf(n);
      return `<span class="chip ${i >= 0 ? 'sel' : ''}" data-ord="${esc(n)}">${
        i >= 0 ? `${i + 1}. ` : ''}${esc(n)}</span>`;
    }).join('') || '<span class="empty">Nobody assigned to this room yet.</span>'}</div>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="startd">Start discussion</button>
      <label class="small muted" style="display:flex; align-items:center; gap:6px; width:auto">
        <input type="checkbox" id="autorunbox" style="width:auto" ${autorunPreference ? 'checked' : ''}>
        run it round-robin automatically
      </label>
    </div>`;
}

function participantRow(p, d) {
  const turn = p.turn || { label: 'Begin Turn', state: 'generic' };
  const inDiscussion = d && d.active && d.order.includes(p.name);
  const running = roomData.autorun && roomData.autorun.active && roomData.autorun.room === selectedRoom;
  // While the round-robin is driving, manual turns would fight it for the same
  // speaking slot. They come back the moment it stops.
  const disabled = busy || running;
  const btn = p.folder_path
    ? `<button class="${turn.state === 'waiting' ? 'waiting' : turn.state === 'generic' ? '' : 'primary'}"
         data-turn="${esc(p.name)}" ${disabled ? 'disabled' : ''}
         title="${esc(running ? 'The round-robin is running — stop it to take turns by hand.' : (turn.prompt || ''))}">${esc(turn.label)}</button>`
    : '<span class="tag no" title="No folder_path — nothing to shell out to">read-only</span>';

  const modes = ['default', 'acceptEdits', 'plan', 'bypassPermissions'];
  const modeSel = p.folder_path
    ? `<select data-mode="${esc(p.name)}" style="width:auto" title="--permission-mode for this participant's headless turn">
         ${modes.map((m) => `<option value="${m}" ${m === p.permission_mode ? 'selected' : ''}>${m}</option>`).join('')}
       </select>` : '';

  return `
    <li class="item">
      <div class="row" style="justify-content:space-between">
        <div>
          <span class="p-name">${esc(p.name)}</span>
          ${inDiscussion ? `<span class="tag">#${d.order.indexOf(p.name) + 1} in order</span>` : ''}
        </div>
        <div class="row">${modeSel}${btn}</div>
      </div>
      <div class="small muted">${p.folder_path ? esc(p.folder_path) : 'no folder'} · last seen ${time(p.last_seen)}</div>
      <div class="row small" style="margin-top:6px">
        <select data-assign2="${esc(p.name)}" style="width:auto">
          ${state.rooms.map((r) => `<option value="${esc(r.name)}" ${r.name === p.room ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
          <option value="waiting">← waiting room</option>
        </select>
      </div>
    </li>`;
}

let roomSig = null;

function renderRoom() {
  if (!selectedRoom) {
    if (roomSig === 'none') return;
    roomSig = 'none';
    paint($('roompane'), '<div class="empty">Select a room on the left, or create one.</div>');
    return;
  }
  if (!roomData) {
    if (roomSig === 'loading') return;
    roomSig = 'loading';
    paint($('roompane'), '<div class="empty">Loading…</div>');
    return;
  }

  // Everything the markup below depends on. If none of it moved, leave the DOM
  // alone — that is what keeps the caret in the box you are typing in.
  const sig = JSON.stringify([roomData, order, turnResult, busy, state.rooms.map((r) => r.name)]);
  if (sig === roomSig) return;
  roomSig = sig;

  const d = roomData.discussion;

  paint($('roompane'), `
    <h2>Room · ${esc(selectedRoom)}</h2>
    <div class="grid2">
      <div class="stack">
        <div>
          <h3>Participants</h3>
          <ul id="plist">${roomData.participants.length
            ? roomData.participants.map((p) => participantRow(p, d)).join('')
            : '<li class="empty">Nobody assigned yet — assign someone from the waiting room.</li>'}</ul>
        </div>
        <div>
          <h3>Discussion</h3>
          ${discussionPanel(d)}
        </div>
        <div>
          <h3>Moderator broadcast</h3>
          <textarea id="bcast" placeholder="Say something to everyone in this room…"></textarea>
          <div style="margin-top:6px"><button id="sendbcast">Send as moderator</button></div>
        </div>
        ${turnResult ? `
        <div>
          <h3>Last Begin Turn — ${esc(turnResult.name || '')}</h3>
          ${turnResult.status === 'auth_required' ? `
            <div class="banner err">
              <b>The Claude Code CLI isn't signed in.</b>
              <div class="small" style="margin-top:4px">
                This is a one-time login, and it's separate from Claude Desktop — the CLI
                keeps its own. Turns can't run until it's done.
              </div>
              <div class="row" style="margin-top:8px">
                <button class="primary" id="dologin" data-folder="${esc(turnResult.folder_path || '')}">Log in to Claude Code</button>
                <span class="small muted">Opens a terminal. Log in there, then run the turn again.</span>
              </div>
            </div>` : `
            <div class="banner ${turnResult.status === 'ok' ? 'ok' : 'err'}">
              ${esc(turnResult.message || `exit ${turnResult.exit_code} after ${turnResult.seconds}s · ${turnResult.turn_state} turn · --permission-mode ${turnResult.permission_mode}`)}
            </div>`}
          ${turnResult.command ? `<pre>${esc(turnResult.command)}</pre>` : ''}
          ${turnResult.stdout ? `<pre>${esc(turnResult.stdout)}</pre>` : ''}
          ${turnResult.stderr ? `<pre class="small">${esc(turnResult.stderr)}</pre>` : ''}
        </div>` : ''}
      </div>

      <div>
        <h3>Messages</h3>
        <div class="feed" id="feed">${roomData.messages.length
          ? roomData.messages.map((m) => `
            <div class="msg ${esc(m.kind)}">
              <div class="who">${m.kind === 'moderator' ? 'MODERATOR' : m.kind === 'system' ? 'SYSTEM' : esc(m.sender)}
                <span class="meta">#${m.id} · ${time(m.created_at)}</span></div>
              <div class="body">${esc(m.body)}</div>
            </div>`).join('')
          : '<div class="empty">No messages yet.</div>'}</div>
      </div>
    </div>`);

  const feed = $('feed');
  if (feed) feed.scrollTop = feed.scrollHeight;

  document.querySelectorAll('[data-ord]').forEach((el) =>
    el.onclick = () => {
      const n = el.dataset.ord;
      const i = order.indexOf(n);
      if (i >= 0) order.splice(i, 1); else order.push(n);
      renderRoom();
    });

  const startd = $('startd');
  if (startd) startd.onclick = async () => {
    const prompt = $('dprompt').value.trim();
    if (!prompt) return alert('Write the issue first.');
    if (!order.length) return alert('Pick a speaking order.');
    autorunPreference = $('autorunbox').checked;
    localStorage.setItem('boardroom.autorun', autorunPreference ? '1' : '0');
    const r = await post('/api/discussion', {
      room: selectedRoom, prompt, order, autorun: autorunPreference,
    });
    if (r.status !== 'ok') return alert(r.message);
    if (r.autorun && r.autorun.status === 'error') {
      alert('Discussion started, but the round-robin could not: ' + r.autorun.message);
    }
    clearField('dprompt');
    order = [];
    refreshRoom();
  };

  const startrun = $('startrun');
  if (startrun) startrun.onclick = async () => {
    startrun.disabled = true;
    const r = await post('/api/autorun/start', { room: selectedRoom });
    if (r.status !== 'ok') alert(r.message);
    refreshRoom();
  };

  const stoprun = $('stoprun');
  if (stoprun) stoprun.onclick = async () => {
    stoprun.textContent = 'Stopping…';
    await post('/api/autorun/stop', {});
    refreshRoom();
  };

  $('sendbcast').onclick = async () => {
    const body = ($('bcast').value || '').trim();
    if (!body) return;
    await post('/api/broadcast', { room: selectedRoom, body });
    clearField('bcast');
    refreshRoom();
  };

  document.querySelectorAll('[data-assign2]').forEach((el) =>
    el.onchange = async () => {
      await post('/api/assign', { name: el.dataset.assign2, room: el.value });
      refreshAll();
    });

  document.querySelectorAll('[data-mode]').forEach((el) =>
    el.onchange = async () => {
      await post('/api/permission-mode', { name: el.dataset.mode, permission_mode: el.value });
    });

  const dologin = $('dologin');
  if (dologin) dologin.onclick = async () => {
    dologin.textContent = 'Opening…';
    const r = await post('/api/open-login', { folder: dologin.dataset.folder });
    alert(r.message || r.status);
    dologin.textContent = 'Log in to Claude Code';
  };

  document.querySelectorAll('[data-turn]').forEach((el) =>
    el.onclick = async () => {
      const name = el.dataset.turn;
      busy = true;
      turnResult = { name, message: 'Running… the headless turn can take a while.', status: 'ok' };
      renderRoom();
      turnResult = await post('/api/begin-turn', { name });
      turnResult.name = name;
      busy = false;
      refreshRoom();
    });
}

function renderApp() {
  const el = $('appstatus');
  if (!appInfo || !appInfo.shell) {
    el.innerHTML = '<span class="small muted">command-line UI</span>';
    return;
  }
  const u = appInfo.update || {};
  const label = {
    idle: '', checking: 'checking for updates…', current: 'up to date',
    downloading: `downloading update ${u.percent || 0}%`,
    ready: `update ${u.version} ready`,
    error: 'update check failed', unsupported: 'dev build',
  }[u.status] || '';

  el.innerHTML = `
    <span class="small muted">v${esc(appInfo.version)}${label ? ' · ' + esc(label) : ''}</span>
    ${u.status === 'ready'
      ? '<button class="primary" id="doupdate" style="margin-left:8px">Restart &amp; install</button>'
      : '<button class="ghost" id="checkupdate" style="margin-left:8px">Check for updates</button>'}`;

  const du = $('doupdate');
  if (du) du.onclick = async () => {
    if (!confirm('Restart Claude Boardroom now to install the update?')) return;
    await post('/api/install-update', {});
  };
  const cu = $('checkupdate');
  if (cu) cu.onclick = async () => {
    cu.textContent = 'Checking…';
    await post('/api/check-update', {});
    appInfo = await api('/api/app');
    renderApp();
  };
}

function renderWiring() {
  if (!wiring) return;
  const sig = JSON.stringify(wiring);
  if (sig === wiringSig) return;
  wiringSig = sig;
  const w = wiring;

  // A config that was readable a moment ago and now isn't is treated as a blip
  // while the app is still rechecking, not as something to alarm you about.
  const health = (appInfo && appInfo.wiring_health) || {};
  const pending = (s) => s && s.transient && !health.settled;

  const row = (label, s, note) => {
    const wait = pending(s);
    const mark = s.ok ? '✓' : wait ? '⋯' : '!';
    return `
    <div class="row" style="justify-content:space-between; padding:5px 0">
      <div>
        <span class="tag ${s.ok ? 'ok' : 'no'}">${mark}</span>
        <span style="margin-left:6px">${esc(label)}</span>
        <span class="small muted" style="margin-left:8px">${esc(s.detail || '')}</span>
      </div>
      ${note ? `<span class="small muted">${note}</span>` : ''}
    </div>`;
  };

  const settledBad = (s) => s && !s.ok && !pending(s);
  const anyPending = pending(w.claude_code) || pending(w.desktop) || pending(w.hook);
  const needsHand = settledBad(w.claude_code) || settledBad(w.hook) ||
    (settledBad(w.desktop) && !w.desktop.missing);
  const auto = w.auto_register;

  paint($('wiring'), `
    <h3>Wiring</h3>
    ${row('Claude Code', w.claude_code)}
    ${row('Auto-poll hook', w.hook)}
    ${row('Claude Desktop', w.desktop, w.desktop.ok ? 'restart Desktop to pick it up' : '')}
    <div class="row" style="margin-top:8px">
      <button id="rewire">${needsHand ? 'Fix setup' : 'Re-apply setup'}</button>
      <span class="small muted">${
        anyPending
          ? 'A config went briefly unreadable — the app is rechecking it, no action needed.'
          : needsHand
            ? 'One click writes the missing config.'
            : 'Kept current automatically on every launch — this just does it now.'}</span>
    </div>
    <div class="small muted" style="margin-top:6px">
      Auto-registration is
      <b>${auto.enabled ? 'on' : 'off'}</b>${auto.enabled && auto.base ? ' for ' + esc(auto.base) : ''}.
    </div>`);

  $('rewire').onclick = async (e) => {
    e.target.textContent = 'Applying…';
    const r = await post('/api/rewire', {});
    wiring = await api('/api/status');
    wiringSig = null;
    renderWiring();
    if (r.status === 'ok' && r.changes && r.changes.length) {
      alert('Applied:\n' + r.changes.join('\n') +
        '\n\nRestart Claude Desktop and start a new Claude Code session to pick it up.');
    } else if (r.status === 'ok') {
      alert('Everything was already correct.');
    } else {
      alert(r.message || 'Could not apply setup.');
    }
  };

  $('autoreg').textContent = auto.enabled && auto.base
    ? `Sessions started in any immediate subfolder of this join the waiting room by themselves.`
    : 'Pick your projects folder to have sessions join the boardroom automatically.';
}

function renderSetup() {
  if (!setup) return;
  $('dbpath').textContent = setup.db_path;
  $('setup').innerHTML = `
    <div>
      <h3>Claude Code — run this in each conversation's working directory</h3>
      <pre>${esc(setup.mcp_add_command)}</pre>
      <button data-copy="${esc(setup.mcp_add_command)}">Copy command</button>
    </div>
    <div>
      <h3>Claude Desktop — merge into <code>${esc(setup.desktop_config_path)}</code></h3>
      <pre>${esc(setup.desktop_config_block)}</pre>
      <button data-copy="${esc(setup.desktop_config_block)}">Copy JSON</button>
      <div class="small muted" style="margin-top:6px">
        Desktop uses one global config for every conversation and needs a full restart
        (quit, not just close the window) to pick it up. Each conversation still has to be
        told to call <code>register</code> with a name you choose.
      </div>
    </div>
    <div>
      <h3>Auto-poll hook — merge into <code>.claude/settings.json</code></h3>
      <pre>${esc(setup.hook_block)}</pre>
      <button data-copy="${esc(setup.hook_block)}">Copy JSON</button>
      <div class="small muted" style="margin-top:6px">
        Runs before each turn and injects new boardroom messages into context.
        It matches the session by its working directory, so the session must have
        registered with that <code>cwd</code>.
      </div>
    </div>`;
  wireCopy();
}

function wireCopy() {
  document.querySelectorAll('[data-copy]').forEach((el) =>
    el.onclick = async () => {
      await navigator.clipboard.writeText(el.dataset.copy);
      const t = el.textContent; el.textContent = 'Copied'; setTimeout(() => (el.textContent = t), 1200);
    });
}

function renderFolders(data) {
  folders = data;
  if (!data) return;
  if (data.status !== 'ok') {
    paint($('folderlist'), `<div class="banner err">${esc(data.message)}</div>`);
    return;
  }

  const detected = data.folders.filter((f) => f.detected);
  const rest = data.folders.filter((f) => !f.detected);

  const item = (f) => `
    <li class="item">
      <div class="row" style="justify-content:space-between">
        <div>
          <span class="p-name">${esc(f.name)}</span>
          ${f.detected ? '<span class="tag ok">Claude-touched</span>' : '<span class="tag no">not detected</span>'}
          ${f.participant
            ? `<span class="tag ok">in boardroom${f.participant.room ? ' · ' + esc(f.participant.room) : ' · waiting'}</span>`
            : ''}
        </div>
        <div class="row">
          ${f.participant
            ? `<button class="ghost" data-forget2="${esc(f.participant.name)}">Remove</button>`
            : `<button class="primary" data-add="${esc(f.path)}">Add to boardroom</button>`}
        </div>
      </div>
      <div class="small muted">${esc(f.path)}${f.markers.length ? ' · ' + f.markers.map(esc).join(', ') : ''}</div>
    </li>`;

  paint($('folderlist'), !data.folders.length
    ? '<div class="empty">No subfolders found.</div>'
    : `
      <h3>Projects in ${esc(data.base)}</h3>
      <div class="small muted" style="margin-bottom:8px">
        Adding a project puts it in the waiting room now, so you can assign it and use
        Begin Turn without waiting for a session to run there first. Anything under your
        projects folder also joins on its own the next time a session takes a turn in it.
      </div>
      <ul>${detected.map(item).join('')}</ul>
      ${rest.length ? `
        <details style="margin-top:8px">
          <summary>${rest.length} folder(s) with no sign of Claude</summary>
          <ul style="margin-top:8px">${rest.map(item).join('')}</ul>
        </details>` : ''}`);

  document.querySelectorAll('[data-add]').forEach((el) =>
    el.onclick = async () => {
      el.textContent = 'Adding…';
      const r = await post('/api/add-project', { folder: el.dataset.add });
      if (r.status === 'error') alert(r.message);
      await scan();
      refreshAll();
    });

  document.querySelectorAll('[data-forget2]').forEach((el) =>
    el.onclick = async () => {
      if (!confirm(`Remove "${el.dataset.forget2}" from the boardroom? Its messages stay in the room.`)) return;
      await post('/api/forget', { name: el.dataset.forget2 });
      await scan();
      refreshAll();
    });
}

/* -------------------------------------------------------------------- actions */

async function scan() {
  const base = ($('base').value || '').trim();
  if (!base) return;
  localStorage.setItem('boardroom.base', base);
  renderFolders(await api('/api/folders?base=' + encodeURIComponent(base)));
}

// Point auto-registration at this folder and list what is in it.
async function useFolder() {
  const base = ($('base').value || '').trim();
  if (!base) return alert('Choose a folder first.');
  const r = await post('/api/projects-dir', { base });
  if (r.status !== 'ok') return alert(r.message);
  wiring = await api('/api/status');
  wiringSig = null;
  renderWiring();
  await scan();
}

async function refreshState() {
  state = await api('/api/state');
  renderSide();
}

async function refreshRoom() {
  if (!selectedRoom) return renderRoom();
  roomData = await api('/api/room?name=' + encodeURIComponent(selectedRoom));
  renderRoom();
}

async function refreshAll() { await refreshState(); await refreshRoom(); }

$('createroom').onclick = async () => {
  const name = ($('newroom').value || '').trim();
  if (!name) return;
  await post('/api/rooms', { name });
  clearField('newroom');
  selectedRoom = name;
  refreshAll();
};
$('newroom').onkeydown = (e) => { if (e.key === 'Enter') $('createroom').click(); };
$('usefolder').onclick = useFolder;
$('base').onkeydown = (e) => { if (e.key === 'Enter') useFolder(); };

$('browse').onclick = async () => {
  const r = await post('/api/pick-folder', {});
  if (r.status !== 'ok') return;
  drafts.base = r.path;
  $('base').value = r.path;
  useFolder();
};

(async function init() {
  setup = await api('/api/setup');
  renderSetup();
  appInfo = await api('/api/app');
  renderApp();
  if (appInfo && appInfo.shell) $('browse').style.display = '';

  wiring = await api('/api/status');
  renderWiring();

  // Prefer the folder auto-registration is already pointed at; fall back to
  // whatever was last scanned in this browser.
  const base = (wiring && wiring.auto_register && wiring.auto_register.base)
    || localStorage.getItem('boardroom.base');
  if (base) { $('base').value = base; drafts.base = base; scan(); }

  await refreshAll();
  setInterval(() => { if (!busy) refreshAll(); }, 2500);
  // Update and wiring state move on their own schedule — poll them gently.
  setInterval(async () => {
    appInfo = await api('/api/app');
    renderApp();
    wiring = await api('/api/status');
    renderWiring();
  }, 10000);
})();
</script>
</body>
